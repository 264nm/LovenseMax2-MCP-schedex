name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Single entry: requires-python floor and .python-version are both 3.14.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Build package
        # Packaging is exercised on every PR so a build failure surfaces here
        # rather than in the release workflow, after the merge has landed.
        run: uv build

      - name: Verify the built wheel imports
        # A py-modules list missing an entry still builds cleanly but ships a
        # broken distribution, so install the wheel and import every module.
        run: |
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import RemoteMCP, Transport, Scheduler, Patterns"
